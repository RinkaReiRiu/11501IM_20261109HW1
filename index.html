<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>植物花語翻翻樂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    background:linear-gradient(135deg,#e8f5e9,#f1f8e9);
    min-height:100vh;
    padding:30px;
}

h1{
    text-align:center;
    color:#2e7d32;
    margin-bottom:20px;
    font-size:42px;
}

.game-rule{
    max-width:900px;
    margin:0 auto 25px auto;

    background:#fff8e1;
    border-left:8px solid #f9a825;
    border-radius:12px;

    padding:18px 25px;

    text-align:center;
    line-height:1.8;
    font-size:18px;

    color:#5d4037;

    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.game-rule strong{
    color:#2e7d32;
    font-size:20px;
}

.description{
    text-align:center;
    margin-bottom:40px;
    color:#555;
    font-size:17px;
}

.game-area{
    max-width:1200px;
    margin:auto;
}

.row-title{
    text-align:center;
    margin-bottom:15px;
    color:#2e7d32;
    font-size:24px;
    font-weight:bold;
}

.row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
    margin-bottom:40px;
}

.card{
    height:120px;
    cursor:pointer;
    perspective:1000px;
}

.card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:0.6s;
}

.card.flipped .card-inner{
    transform:rotateY(180deg);
}

.front,
.back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:10px;

    backface-visibility:hidden;
    font-weight:bold;
}

.front{
    background:#43a047;
    color:white;
    font-size:30px;
}

.back{
    background:white;
    border:3px solid #43a047;
    transform:rotateY(180deg);
    color:#333;
    font-size:18px;
}

.matched{
    opacity:0;
    pointer-events:none;
    transition:.6s;
}

.modal{
    display:none;
    justify-content:center;
    align-items:center;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);

    z-index:999;
}

.modal-content{
    width:90%;
    max-width:700px;

    background:white;
    border-radius:20px;

    padding:35px;
    position:relative;

    animation:popup .3s ease;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.close-icon{

    position:absolute;
    top:15px;
    right:15px;

    width:60px;
    height:60px;

    border:none;
    border-radius:50%;

    background:#e53935;
    color:white;

    font-size:36px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 4px 12px rgba(0,0,0,.3);

    transition:.2s;
}

.close-icon:hover{
    background:#c62828;
    transform:scale(1.1);
}

.modal h2{
    color:#2e7d32;
    margin-bottom:20px;
    padding-right:70px;
}

.modal p{
    line-height:2;
    color:#444;
    font-size:18px;
    margin-bottom:25px;
}

.next-btn{

    width:100%;

    border:none;
    border-radius:12px;

    background:#43a047;
    color:white;

    padding:16px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
}

.next-btn:hover{
    background:#2e7d32;
}

.win{

    display:none;

    text-align:center;

    margin-top:30px;

    color:#2e7d32;

    font-size:36px;
    font-weight:bold;
}

@media(max-width:768px){

    .row{
        grid-template-columns:repeat(2,1fr);
    }

    .card{
        height:100px;
    }

    h1{
        font-size:32px;
    }
}

</style>
</head>

<body>

<h1>🌸 植物花語翻翻樂 🌸</h1>

<div class="game-rule">
    🎮 <strong>遊戲方式</strong><br>
    請從 <strong>上排植物卡</strong> 選擇一張，
    再從 <strong>下排花語卡</strong> 選擇一張。<br>

    若兩者配對正確，即可消除卡片並解鎖植物百科介紹！
</div>

<p class="description">
找出所有正確的植物與花語配對，完成你的植物知識挑戰。
</p>

<div class="game-area">

    <div class="row-title">
        🌱 植物名稱
    </div>

    <div id="plantRow" class="row"></div>

    <div class="row-title">
        💬 花語
    </div>

    <div id="meaningRow" class="row"></div>

    <div id="winMessage" class="win">
        🎉 恭喜完成全部配對！
    </div>

</div>

<div id="modal" class="modal">

    <div class="modal-content">

        <button class="close-icon" onclick="closeModal()">
            ✕
        </button>

        <h2 id="plantName"></h2>

        <p id="plantInfo"></p>

        <button class="next-btn" onclick="closeModal()">
            我知道了，繼續遊戲 →
        </button>

    </div>

</div>

<script>

const plants = [

{
id:1,
name:"向日葵",
meaning:"勇敢追夢",
intro:"向日葵會跟隨太陽轉動，因此象徵光明、勇氣以及追逐理想的精神。"
},

{
id:2,
name:"玫瑰",
meaning:"真摯愛情",
intro:"玫瑰象徵愛情與浪漫，是世界上最具代表性的情感花卉之一。"
},

{
id:3,
name:"百合",
meaning:"純潔祝福",
intro:"百合花象徵純潔、高雅與幸福，經常出現在婚禮與祝福場合。"
},

{
id:4,
name:"薰衣草",
meaning:"等待愛情",
intro:"薰衣草散發迷人香氣，象徵守候、等待以及對愛情的期待。"
},

{
id:5,
name:"櫻花",
meaning:"珍惜當下",
intro:"櫻花花期短暫，因此常被視為珍惜生命與當下美好時光的象徵。"
}

];

const plantRow=document.getElementById("plantRow");
const meaningRow=document.getElementById("meaningRow");

let firstCard=null;
let secondCard=null;
let lock=false;
let matched=0;

function shuffle(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

function createCard(text,id,type){

    const card=document.createElement("div");

    card.className="card";

    card.dataset.id=id;
    card.dataset.type=type;

    card.innerHTML=`
        <div class="card-inner">

            <div class="front">?</div>

            <div class="back">
                ${text}
            </div>

        </div>
    `;

    card.addEventListener("click",flipCard);

    return card;
}

shuffle(plants).forEach(p=>{
    plantRow.appendChild(
        createCard(p.name,p.id,"plant")
    );
});

shuffle(plants).forEach(p=>{
    meaningRow.appendChild(
        createCard(p.meaning,p.id,"meaning")
    );
});

function flipCard(){

    if(lock) return;

    if(this===firstCard) return;

    this.classList.add("flipped");

    if(!firstCard){
        firstCard=this;
        return;
    }

    secondCard=this;

    checkMatch();
}

function checkMatch(){

    const sameID=
    firstCard.dataset.id===secondCard.dataset.id;

    const differentType=
    firstCard.dataset.type!==secondCard.dataset.type;

    if(sameID && differentType){

        lock=true;

        setTimeout(()=>{

            firstCard.classList.add("matched");
            secondCard.classList.add("matched");

            matched++;

            showPlantInfo(firstCard.dataset.id);

            resetCards();

            if(matched===plants.length){

                setTimeout(()=>{
                    document.getElementById("winMessage").style.display="block";
                },500);
            }

        },500);

    }else{

        lock=true;

        setTimeout(()=>{

            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");

            resetCards();

        },1000);
    }
}

function resetCards(){

    firstCard=null;
    secondCard=null;
    lock=false;
}

function showPlantInfo(id){

    const plant=plants.find(
        p=>p.id==id
    );

    document.getElementById("plantName").textContent=
    plant.name;

    document.getElementById("plantInfo").innerHTML=
    `<strong>花語：</strong>${plant.meaning}<br><br>${plant.intro}`;

    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
